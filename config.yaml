qdrant:
  collection_name: "hydra_passages"
  host: "localhost"
  port: 6333
  dense_vector: "dense"
  sparse_vector: "sparse"

retrieval:
  model_name: "BAAI/bge-small-en-v1.5"
  query_prefix: "Represent this sentence for searching relevant passages: "
  max_seq_length: 256
  top_k: 5
  candidates_per_leg: 50

fusion:
  method: "rrf"
  rrf_k: 60
  weights:
    dense: 1.0
    sparse: 1.0

paths:
  passages: "data/passages.jsonl"
  embeddings: "data/embeddings.npy"
  categories: "data/categories.json"
  eval_set: "data/eval_set.json"
  results_dir: "results"

rerank:
  enabled: false
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  pool_size: 20

benchmark:
  latency_queries: 100
  warmup_queries: 10

evaluation:
  sample_size: 25
  judge_model: "openai/gpt-oss-120b"